<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>斗币大陆 · 永久入口</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23d4af37'/><text x='50' y='62' text-anchor='middle' font-size='40' font-weight='bold' fill='%231a1a2e'>$</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(212,175,55,.10), transparent 60%),
      radial-gradient(ellipse 50% 40% at 85% 90%, rgba(120,90,30,.16), transparent 60%),
      linear-gradient(160deg, #0b0e1a 0%, #12162a 45%, #0d1120 100%);
    color: #e8e6df;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }
  .wrap { width: 100%; max-width: 860px; text-align: center; }
  /* 竖向印章 */
  .seal {
    display: inline-block;
    writing-mode: vertical-rl;
    font-size: 15px;
    letter-spacing: 6px;
    color: #d4af37;
    border: 2px solid rgba(212,175,55,.55);
    padding: 10px 6px;
    border-radius: 6px;
    background: rgba(212,175,55,.06);
    margin-bottom: 22px;
    text-shadow: 0 0 12px rgba(212,175,55,.35);
  }
  h1 {
    font-size: clamp(34px, 6vw, 52px);
    font-weight: 900;
    letter-spacing: 8px;
    background: linear-gradient(180deg, #f4d678 0%, #d4af37 55%, #9a7420 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 2px 10px rgba(212,175,55,.25));
  }
  .sub {
    margin-top: 10px;
    font-size: clamp(13px, 2.4vw, 16px);
    color: #b9b4a8;
    letter-spacing: 3px;
  }
  .tagline {
    margin-top: 18px;
    font-size: 13px;
    color: #8f8b80;
    letter-spacing: 1px;
  }
  .cards {
    margin-top: 42px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
  }
  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    border: 1px solid rgba(212,175,55,.28);
    border-radius: 16px;
    padding: 30px 22px 24px;
    background: linear-gradient(180deg, rgba(212,175,55,.07), rgba(212,175,55,.02) 55%, rgba(20,24,44,.6));
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, #d4af37, transparent);
    opacity: .5;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(212,175,55,.6);
    box-shadow: 0 12px 40px rgba(0,0,0,.45), 0 0 24px rgba(212,175,55,.08);
  }
  .card .icon {
    width: 46px; height: 46px;
    margin: 0 auto 16px;
    color: #d4af37;
    display: flex; align-items: center; justify-content: center;
  }
  .card .name {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #f0ead9;
  }
  .card .desc {
    margin-top: 10px;
    font-size: 12.5px;
    line-height: 1.7;
    color: #9b968a;
    min-height: 42px;
  }
  .card .enter {
    display: inline-block;
    margin-top: 16px;
    padding: 7px 22px;
    font-size: 13px;
    letter-spacing: 2px;
    color: #12162a;
    background: linear-gradient(180deg, #f0d478, #d4af37);
    border-radius: 20px;
    font-weight: 700;
  }
  .foot {
    margin-top: 40px;
    font-size: 12px;
    color: #6e6a60;
    letter-spacing: 1px;
    line-height: 1.8;
  }
  .foot a { color: #9a8b5a; text-decoration: none; }
  @media (max-width: 640px) {
    body { padding: 28px 14px; }
    .cards { grid-template-columns: 1fr; gap: 14px; }
    .card { padding: 24px 18px 20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="seal">斗破苍穹 · 观天下</div>
  <h1>斗币大陆</h1>
  <div class="sub">全球资产动态看板 · 实时战况</div>
  <div class="tagline">远古八族 · 丹塔 · 药老 · 能量球资产流动 —— 页面内置免 Key 实时自更新</div>

  <div class="cards">
    <a class="card" href="./pc.html">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="46" height="46">
          <rect x="2" y="4" width="20" height="13" rx="2"/>
          <path d="M8 21h8M12 17v4"/>
        </svg>
      </div>
      <div class="name">电脑版</div>
      <div class="desc">桌面宽屏布局 · 全景看板<br>适合电脑端大屏观战</div>
      <div class="enter">进入电脑版</div>
    </a>
    <a class="card" href="./mobile.html">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="46" height="46">
          <rect x="7" y="2" width="10" height="20" rx="2.5"/>
          <path d="M11 18.5h2"/>
        </svg>
      </div>
      <div class="name">手机版</div>
      <div class="desc">移动端竖屏适配 · 单手掌控<br>适合手机随时查看</div>
      <div class="enter">进入手机版</div>
    </a>
  </div>

  <div class="foot">
    数据实时更新 · 免 Key 自更新引擎 · 支持手动刷新<br>
    永久托管于 GitHub Pages · <a href="https://github.com/l3971716/doubi-dalu" target="_blank" rel="noopener">doubi-dalu 开源仓库</a>
  </div>
</div>
</body>
</html>
